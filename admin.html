<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لونا · الطلبات</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z' fill='%23c9a96a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
/* Layout: same night palette as the store; summary tiles, status tabs, order list, detail drawer */
:root{
  --bg:#f7f4f8;--surface:#ffffff;--sunk:#efeaf1;--ink:#251d33;--muted:#6c6278;--line:#e0d8e4;
  --accent:#5b3a74;--accent-ink:#ffffff;--accent-soft:#ece3f2;--moon:#c9a96a;--sale:#a1394f;--ok:#2f7a5b;--info:#2f5d8a;
  --display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --latin:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17121f;--surface:#211a2c;--sunk:#1c1626;--ink:#f1ebf5;--muted:#a99fb5;--line:#352c42;
  --accent:#c4a3dc;--accent-ink:#1d1527;--accent-soft:#2e2440;--moon:#d9bd84;--sale:#e57f95;--ok:#6cc59d;--info:#8fb8e3;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 20px;border:1px solid transparent;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--sale);font-size:13px;min-height:20px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;font-weight:700}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px}
.login-card h1{font-size:24px;margin-block:14px 4px}
.login-card p{color:var(--muted);margin:0 0 20px;font-size:13.5px}

/* app */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
header .who{margin-inline-start:auto;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-block:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile b{display:block;font-size:26px;font-family:var(--display);margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab small{opacity:.7;margin-inline-start:4px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;width:260px;max-width:100%}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:40px}
.row{display:grid;grid-template-columns:150px 1.4fr 1fr 70px 90px 120px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:none;border-inline:0;border-top:0}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--sunk)}
.row.head{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
.row .ono{font-family:var(--latin);font-style:italic;font-size:16px;direction:ltr;text-align:right}
.row .sub{display:block;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;width:fit-content}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{color:var(--accent);background:var(--accent-soft)}
.s-confirmed{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.s-shipped{color:#8a6a2a;background:color-mix(in srgb,var(--moon) 22%,transparent)}
.s-delivered{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.s-cancelled{color:var(--muted);background:var(--sunk)}
@media (prefers-color-scheme:dark){.s-shipped{color:var(--moon)}}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,14,28,.5);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(480px,100%);background:var(--surface);z-index:40;display:flex;flex-direction:column;box-shadow:0 18px 50px -24px rgba(0,0,0,.5)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.d-body{flex:1;overflow:auto;padding:20px;display:grid;gap:18px;align-content:start}
.x{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center}
.x:hover{background:var(--sunk)}
.sect h3{font-size:14px;font-family:var(--body);font-weight:600;color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a,.links button{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;color:var(--ink);background:none}
.item{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);font-size:14px}
.item span{color:var(--muted);font-size:12.5px;display:block}
.sum{display:flex;justify-content:space-between;font-size:14px;padding-top:6px}
.sum.total{font-weight:600;font-size:16px}
.statuses{display:flex;flex-wrap:wrap;gap:8px}
.statuses button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px}
.statuses button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:60;font-size:14px}

@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr auto;gap:4px 12px}.row.head{display:none}
  .row .c-city,.row .c-items{display:none}.row .c-total{text-align:end}}
</style>
</head>
<body>

<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="var(--moon)"/></svg>لونا</div>
    <h1>لوحة الطلبات</h1>
    <p id="loginHint">سجّلي دخولك بحساب المسؤول.</p>
    <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required dir="ltr"></div>
    <div class="field"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" required dir="ltr"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn" style="width:100%" id="loginBtn">دخول</button>
  </form>
</section>

<div id="appView" hidden>
  <header><div class="wrap">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="var(--moon)"/></svg>لونا <span style="font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted)">· الطلبات</span></div>
    <span class="live" id="live"><i></i><span>تحديث مباشر</span></span>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="logout" style="padding:7px 14px">خروج</button>
  </div></header>

  <main class="wrap">
    <section class="tiles" aria-label="ملخص">
      <div class="tile"><span>طلبات جديدة بانتظارك</span><b class="num" id="tNew">–</b></div>
      <div class="tile"><span>طلبات اليوم</span><b class="num" id="tToday">–</b></div>
      <div class="tile"><span>مبيعات هالشهر</span><b class="num" id="tMonth">–</b></div>
      <div class="tile"><span>متوسط الطلب</span><b class="num" id="tAvg">–</b></div>
    </section>
    <div class="bar">
      <div class="tabs" id="tabs" role="group" aria-label="حالة الطلب"></div>
      <label><span hidden>بحث</span><input class="search" id="q" type="search" placeholder="ابحثي بالاسم أو الرقم أو رقم الطلب"></label>
    </div>
    <div class="list" id="list"><div class="empty">عم نحمّل الطلبات…</div></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="d-head"><h2 id="dTitle" class="num" style="font-size:20px"></h2><button class="x" id="dClose" aria-label="إغلاق"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="d-body" id="dBody"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG = window.LUNA_CONFIG || {};
const CUR = CFG.currencySymbol || '$';
const sb = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const STATUS = [['new','جديد'],['confirmed','مؤكَّد'],['shipped','انشحن'],['delivered','تسلّمته'],['cancelled','ملغي']];
const statusName = s => (STATUS.find(x=>x[0]===s)||[,s])[1];
const SHIP_NAME = {std:'توصيل عادي',exp:'توصيل سريع'};
const $ = s=>document.querySelector(s);
const money = c => CUR + (c/100).toFixed(c%100?2:0);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt = new Intl.DateTimeFormat('ar',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});

let orders=[], filter='all', openId=null;

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600)}

/* sign in */
async function boot(){
  if(!sb){
    $('#loginView').hidden=false;
    $('#loginHint').textContent='قاعدة البيانات مش مربوطة لسّا. عبّي js/config.js حسب دليل الإعداد.';
    $('#loginBtn').disabled=true;return;
  }
  const {data:{session}}=await sb.auth.getSession();
  session?enter(session):($('#loginView').hidden=false);
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#loginErr').textContent='';$('#loginBtn').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
  $('#loginBtn').disabled=false;
  if(error){$('#loginErr').textContent='البريد أو كلمة السر غلط.';return}
  enter(data.session);
};
async function enter(session){
  const {data:isAdmin}=await sb.rpc('is_admin');
  if(!isAdmin){
    await sb.auth.signOut();
    $('#loginView').hidden=false;
    $('#loginErr').textContent='هالحساب مش مضاف كمسؤول. شوفي الخطوة 4 بدليل الإعداد.';return;
  }
  $('#loginView').hidden=true;$('#appView').hidden=false;
  $('#who').textContent=session.user.email;
  await loadOrders();
  listen();
}
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};

/* data */
async function loadOrders(){
  const {data,error}=await sb.from('orders').select('*, order_items(*)').order('created_at',{ascending:false}).limit(500);
  if(error){$('#list').innerHTML='<div class="empty">ما قدرنا نحمّل الطلبات. حدّثي الصفحة.</div>';return}
  orders=data;render();
  if(openId)openOrder(openId);
}
function listen(){
  sb.channel('orders-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},()=>{toast('وصل طلب جديد');loadOrders()})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},()=>loadOrders())
    .subscribe(s=>$('#live').classList.toggle('on',s==='SUBSCRIBED'));
}

/* render */
function render(){
  const now=new Date(), today=now.toDateString(), month=now.getMonth(), year=now.getFullYear();
  const live=orders.filter(o=>o.status!=='cancelled');
  const monthly=live.filter(o=>{const d=new Date(o.created_at);return d.getMonth()===month&&d.getFullYear()===year});
  const monthSum=monthly.reduce((s,o)=>s+o.total_cents,0);
  $('#tNew').textContent=orders.filter(o=>o.status==='new').length;
  $('#tToday').textContent=orders.filter(o=>new Date(o.created_at).toDateString()===today).length;
  $('#tMonth').textContent=money(monthSum);
  $('#tAvg').textContent=monthly.length?money(Math.round(monthSum/monthly.length)):'–';

  const count=s=>s==='all'?orders.length:orders.filter(o=>o.status===s).length;
  $('#tabs').innerHTML=[['all','الكل'],...STATUS].map(([k,v])=>`<button class="tab" data-f="${k}" aria-pressed="${filter===k}">${v}<small class="num">${count(k)}</small></button>`).join('');

  const q=$('#q').value.trim().toLowerCase();
  const list=orders.filter(o=>(filter==='all'||o.status===filter)&&(!q||[o.order_no,o.customer_name,o.phone,o.city].join(' ').toLowerCase().includes(q)));
  $('#list').innerHTML = list.length
    ? `<div class="row head"><span>رقم الطلب</span><span>الزبونة</span><span class="c-city">المدينة</span><span class="c-items">القطع</span><span>المجموع</span><span>الحالة</span></div>`+
      list.map(o=>`<button class="row" data-id="${o.id}">
        <span><span class="ono">${esc(o.order_no)}</span><span class="sub">${dateFmt.format(new Date(o.created_at))}</span></span>
        <span>${esc(o.customer_name)}<span class="sub num" dir="ltr" style="text-align:right">${esc(o.phone)}</span></span>
        <span class="c-city">${esc(o.city)}</span>
        <span class="c-items num">${o.order_items.reduce((s,i)=>s+i.qty,0)}</span>
        <span class="c-total num">${money(o.total_cents)}</span>
        <span><span class="pill s-${o.status}">${statusName(o.status)}</span></span>
      </button>`).join('')
    : `<div class="empty">${orders.length?'ما في طلبات بهالفلتر.':'لسّا ما وصل ولا طلب. أول ما تطلب زبونة من المتجر، بيظهر طلبها هون فوراً.'}</div>`;
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render()}
  const r=e.target.closest('.row[data-id]');if(r)openOrder(r.dataset.id);
});
$('#q').oninput=render;

/* order detail */
function openOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;openId=id;
  const digits=o.phone.replace(/[^0-9]/g,'');
  $('#dTitle').textContent=o.order_no;
  $('#dBody').innerHTML=`
    <div class="sect"><h3>الحالة</h3><div class="statuses">${STATUS.map(([k,v])=>`<button data-s="${k}" aria-pressed="${o.status===k}">${v}</button>`).join('')}</div></div>
    <div class="sect"><h3>الزبونة</h3>
      <dl class="kv"><dt>الاسم</dt><dd>${esc(o.customer_name)}</dd><dt>الموبايل</dt><dd class="num" dir="ltr" style="text-align:right">${esc(o.phone)}</dd>
      <dt>المدينة</dt><dd>${esc(o.city)}</dd><dt>العنوان</dt><dd>${esc(o.address)}</dd>${o.notes?`<dt>ملاحظات</dt><dd>${esc(o.notes)}</dd>`:''}
      <dt>وقت الطلب</dt><dd>${dateFmt.format(new Date(o.created_at))}</dd></dl>
      <div class="links"><a href="https://wa.me/${digits}" target="_blank" rel="noopener">واتساب</a><button type="button" id="copyPhone">نسخ الرقم</button></div>
    </div>
    <div class="sect"><h3>القطع</h3>
      ${o.order_items.map(i=>`<div class="item"><div>${esc(i.product_name)}<span class="num">المقاس <bdi>${esc(i.size)}</bdi> · الكمية ${i.qty}</span></div><span class="num" style="color:var(--ink);font-size:14px">${money(i.unit_price_cents*i.qty)}</span></div>`).join('')}
      <div class="sum"><span>المجموع الفرعي</span><span class="num">${money(o.subtotal_cents)}</span></div>
      <div class="sum"><span>${SHIP_NAME[o.shipping_method]}</span><span class="num">${o.shipping_cents?money(o.shipping_cents):'مجاني'}</span></div>
      <div class="sum total"><span>الإجمالي · الدفع عند الاستلام</span><span class="num">${money(o.total_cents)}</span></div>
    </div>
    <div class="sect"><h3>ملاحظة داخلية</h3>
      <div class="field" style="margin:0"><label for="note" hidden>ملاحظة</label><textarea id="note" rows="3" placeholder="مثلاً: اتصلت وأكّدت، التوصيل بعد الساعة 5">${esc(o.admin_note)}</textarea></div>
      <button class="btn ghost" id="saveNote" style="margin-top:8px;padding:7px 16px">حفظ الملاحظة</button></div>`;
  $('#copyPhone').onclick=()=>navigator.clipboard?.writeText(o.phone).then(()=>toast('انتسخ الرقم'),()=>toast(o.phone));
  $('#saveNote').onclick=()=>save(o.id,{admin_note:$('#note').value.trim()||null},'انحفظت الملاحظة');
  $('#dBody').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(b.dataset.s!==o.status)save(o.id,{status:b.dataset.s},'صارت الحالة: '+statusName(b.dataset.s))});
  $('#drawer').hidden=false;$('#scrim').hidden=false;
}
async function save(id,patch,msg){
  const {error}=await sb.from('orders').update(patch).eq('id',id);
  if(error){toast('ما انحفظ التعديل. جرّبي مرة تانية.');return}
  toast(msg);await loadOrders();
}
function closeDrawer(){openId=null;$('#drawer').hidden=true;$('#scrim').hidden=true}
$('#dClose').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

boot();
</script>
</body>
</html>
