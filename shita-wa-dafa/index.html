<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>شتا ودفا · كروشيه وصوف شغل إيد</title>
<meta name="description" content="جواكيت وبطانيات ومفارش وإكسسوارات بالكروشيه، بتنحاك بالإيد على طلبك وبالألوان اللي بتحبيها. اطلبي مباشرة على واتساب.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="شتا ودفا">
<meta property="og:title" content="شتا ودفا · كروشيه وصوف شغل إيد">
<meta property="og:description" content="جواكيت وبطانيات ومفارش وإكسسوارات بالكروشيه، بتنحاك بالإيد على طلبك. اطلبي على واتساب.">
<meta property="og:image" content="https://anas7anoos-boop.github.io/luna-store/shita-wa-dafa/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#9E2F4C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#EDF0EA;--surf:#FFFFFF;--surf2:#E1E7DE;--ink:#1E2A25;--mut:#3F4C45;--line:#D2D9CE;--acc:#9E2F4C;--accInk:#FFFFFF;--sun:#DFA437;--sunInk:#2B1E06;--shadow:rgba(30,42,37,.18);--glass:rgba(237,240,234,.84);--stitch:#B9C3B4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111814;--surf:#19221E;--surf2:#212C27;--ink:#EBF0EA;--mut:#BCC6C0;--line:#2B3731;--acc:#E57C96;--accInk:#2A0E17;--sun:#EFBD57;--sunInk:#2B1E06;--shadow:rgba(0,0,0,.5);--glass:rgba(17,24,20,.86);--stitch:#3A4740;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111814;--surf:#19221E;--surf2:#212C27;--ink:#EBF0EA;--mut:#BCC6C0;--line:#2B3731;--acc:#E57C96;--accInk:#2A0E17;--sun:#EFBD57;--sunInk:#2B1E06;--shadow:rgba(0,0,0,.5);--glass:rgba(17,24,20,.86);--stitch:#3A4740;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;font-size:16px;direction:rtl;line-height:1.75;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.disp{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;letter-spacing:0}
.sel{user-select:all;direction:ltr;display:inline-block}
/* stitched rule: a row of knit Vs */
.rule{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,currentColor 0 12px,transparent 12px 20px)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 20px;font-weight:500;cursor:pointer;text-decoration:none;font-size:15.5px;min-height:46px;transition:transform .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);color:var(--accInk)}
.btn.ghost{background:var(--surf);border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 14px;min-height:38px;font-size:14.5px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mk{width:34px;height:34px;flex:none;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand .mk svg{width:24px;height:24px}
.brand b{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:30px;line-height:1}
.top .sp{flex:1}
/* hero */
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:center;padding-block:44px 36px}
.hero h1{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:clamp(46px,7.4vw,96px);line-height:1;margin:0 0 18px;text-wrap:balance}
.hero p.tag{font-size:clamp(17px,2vw,20px);color:var(--mut);margin:0 0 26px;max-width:36ch}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.hero .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--mut);font-size:14.5px}
.hero .facts b{color:var(--ink);font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:26px;line-height:1;display:block}
.swatch{position:relative;perspective:1100px;cursor:pointer;touch-action:pan-y;max-width:100%}
.swatch .fab{position:relative;transform-style:preserve-3d;transition:transform .35s ease-out;transform:rotateX(8deg) rotateY(-10deg) rotateZ(-1.5deg)}
.swatch canvas{display:block;width:100%;height:auto;border-radius:6px 6px 14px 14px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 30px 50px -20px var(--shadow),0 60px 80px -40px var(--shadow)}
.swatch .needle{position:absolute;top:-10px;left:-4%;right:-4%;height:10px;border-radius:99px;background:linear-gradient(#e9d7a8,#b8975a 60%,#8a6c37);box-shadow:0 3px 6px var(--shadow);transform:translateZ(20px)}
.swatch .needle::after{content:"";position:absolute;left:-10px;top:-5px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1e3bd,#a7854a)}
.swatch .hint{display:block;text-align:center;margin-top:16px;font-size:13.5px;color:var(--mut)}
.swatch .dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.swatch .dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--surf);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch .dots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
/* trust */
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-block:6px 30px}
.trust .t{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--surf);border-radius:16px;padding:16px}
.trust .t::after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--line);border-radius:11px;pointer-events:none}
.trust svg{width:26px;height:26px;flex:none;color:var(--acc);margin-top:2px}
.trust b{display:block;font-weight:700;font-size:15.5px}
.trust small{color:var(--mut);font-size:13.5px;line-height:1.5;display:block}
@media (max-width:900px){.trust .wrap{grid-template-columns:1fr 1fr}}
/* nav */
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:8px;align-items:center;padding-block:10px}
.chips .fam{flex-wrap:wrap}
.fam>button{border:0;background:none;padding:6px 4px;margin-inline-end:10px;font-size:16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:500}
.fam>button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.srch{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;flex:0 1 320px;min-width:0}
.srch svg{width:18px;height:18px;color:var(--mut);flex:none}
.srch input{border:0;background:transparent;font:inherit;color:var(--ink);min-width:0;width:100%;padding:8px 0;outline:none}
.row2{overflow-x:auto;scrollbar-width:none;padding-top:0!important}
.row2::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:6px 14px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:640px){.srch{flex:1 1 100%;order:9}.fam>button{font-size:15px;margin-inline-end:6px}}
/* sections */
main{padding-block:6px 40px}
.cat{padding-block:40px 6px;scroll-margin-top:150px}
.cat-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.cat-h h2{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1;margin:0}
.cat-h span{color:var(--ink);font-size:15.5px;font-weight:500}
.cat-h .lbl{background:var(--ink);color:var(--bg)!important;border-radius:8px;padding:1px 10px;font-size:13.5px;font-weight:500}
.cat .rule{margin:10px 0 20px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:16px 12px}}
.card .in{position:relative;transform-style:preserve-3d;transition:transform .25s ease-out}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--surf2);box-shadow:0 16px 30px -16px var(--shadow)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.card .ph img.back{opacity:0}
@media (hover:hover){.card:hover .ph img.back{opacity:1}}
.card .badge{position:absolute;top:10px;right:10px;background:var(--sun);color:var(--sunInk);font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:6px}
.card .badge.out{background:var(--ink);color:var(--bg)}
.card .meta{display:flex;flex-direction:column;gap:4px;padding:12px 2px 0}
.card h3{font-size:16px;font-weight:500;margin:0;line-height:1.45}
.card .tagp{align-self:flex-start;position:relative;background:var(--surf);border-radius:8px;padding:2px 10px 2px 12px}
.card .tagp::after{content:"";position:absolute;inset:3px;border:1px dashed var(--line);border-radius:5px;pointer-events:none}
.card .pr{color:var(--acc);font-weight:700;font-size:14.5px}
.card .pr.ask{color:var(--mut);font-weight:400;font-size:13.5px}
.empty{color:var(--mut);background:var(--surf);border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center}
/* how */
.how{margin-top:56px;background:var(--ink);color:var(--bg);border-radius:24px;padding:30px clamp(18px,4vw,40px)}
.how h2{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0 0 20px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;line-height:1.6}
.steps li::before{content:counter(s);font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:28px;width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--sun);color:var(--sunInk)}
.steps b{font-size:17px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
/* faq */
.faq{display:grid;grid-template-columns:1fr 2fr;gap:24px;margin-top:56px}
.faq h2{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0 0 8px}
.faq .s{color:var(--mut);margin:0}
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-weight:500;font-size:16.5px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--acc);font-size:22px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 14px;color:var(--mut)}
@media (max-width:760px){.faq{grid-template-columns:1fr}}
/* footer */
footer{margin-top:20px;border-top:1px solid var(--line);padding-block:0 40px;color:var(--mut);font-size:14.5px}
footer .rule{color:var(--stitch);margin-bottom:28px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
footer .fb{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:38px;line-height:1;color:var(--ink)}
footer h4{margin:0 0 8px;color:var(--ink);font-size:15px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
footer ul button{background:none;border:0;padding:0;cursor:pointer;color:var(--mut);text-align:inherit}
footer ul button:hover{color:var(--ink)}
footer .copy{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px}
@media (max-width:700px){footer .cols{grid-template-columns:1fr}}
/* modal */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh;width:100%;height:100%;margin:0;color:var(--ink)}
dialog:focus-visible{outline:none}
dialog::backdrop{background:rgba(12,20,16,.6);backdrop-filter:blur(3px)}
.sheet{position:absolute;inset:auto 0 0 0;max-height:94dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -20px 50px var(--shadow);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){.sheet{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(1000px,94vw);border-radius:24px;max-height:90dvh}}
.sheet .x{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg);z-index:2}
.pv{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;padding:0 20px 10px}
@media (max-width:859px){.pv{grid-template-columns:1fr;gap:14px;padding:0 16px}}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;border-radius:18px}
.gal img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;border-radius:18px;background:var(--surf2)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots b.on{background:var(--acc);width:20px;border-radius:9px}
.pv h2{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:clamp(36px,4.4vw,50px);line-height:1;margin:6px 0 10px}
.pv .price{display:inline-block;font-size:21px;font-weight:700;color:var(--acc);margin-bottom:12px}
.pv .price.ask{font-size:16px;color:var(--mut);font-weight:400}
.pv .desc{margin:0 0 14px;color:var(--ink);white-space:pre-line}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 18px;font-size:15px;background:var(--surf);border-radius:14px;padding:12px 14px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:6px 12px;min-height:40px;cursor:pointer}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:13.5px;color:var(--mut);margin-top:10px}
/* admin */
.adm-fab{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 10px 30px var(--shadow)}
.adm{padding:0 16px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;position:sticky;top:60px;background:var(--bg);z-index:2}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:6px 14px;cursor:pointer;min-height:38px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--surf);border-top:1px solid var(--line);margin-top:10px}
.savebar .msg{flex:1;min-width:160px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.row img{width:56px;height:68px;object-fit:cover;border-radius:10px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--mut)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .yarn{width:28px;height:28px;flex:none}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:14px;color:var(--mut)}
.fld input,.fld select,.fld textarea{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
.fld textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .th{position:relative}
.thumbs img{width:76px;height:92px;object-fit:cover;border-radius:10px;display:block}
.thumbs .th button{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:14px;line-height:1}
.thumbs .th button.mv{top:auto;bottom:-6px;left:auto;right:-6px;background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.upl{display:grid;place-items:center;width:76px;height:92px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;color:var(--mut);font-size:26px}
.confirm{background:var(--surf2);border-radius:12px;padding:10px 12px;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meter{font-size:13px;color:var(--mut)}
/* shop additions */
.top .tools{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn .n{position:absolute;top:-7px;left:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:var(--accInk);font-size:12px;line-height:20px;text-align:center;padding:0 5px;font-weight:700}
.icon-btn .n[data-n="0"]{display:none}
.wa svg{width:20px;height:20px}
@media (max-width:560px){.wa .t{display:none}.wa{width:44px;padding:0!important}.brand b{font-size:26px}}
.card{position:relative;perspective:900px;display:block;width:100%}
.card .open{display:block;width:100%;border:0;background:none;padding:0;text-align:inherit;cursor:pointer;color:inherit;font:inherit}
.favb{position:absolute;top:10px;left:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.favb svg{width:20px;height:20px}
[data-fav][aria-pressed="true"]{color:var(--sun)}
[data-fav][aria-pressed="true"] svg{fill:currentColor}
.sortw{flex:none;display:flex;align-items:center}
.sortw select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:4px 10px}
.buy{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.buy .icon-btn{flex:none}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surf);flex:none}
.qty button{width:36px;height:40px;border:0;background:none;cursor:pointer;font-size:18px;color:var(--ink)}
.qty span{min-width:28px;text-align:center;font-weight:500}
.line .qty button{height:32px;width:32px}
.err{color:var(--acc);min-height:1.2em;margin:4px 0;font-size:14.5px}
.sheet .body{padding:0 16px 10px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:80px;object-fit:cover;border-radius:10px;background:var(--surf2)}
.line h4{margin:0;font-size:15.5px;font-weight:500}
.line .sub{color:var(--mut);font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.line .le{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.line .lp{font-size:15px}
.rm{border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13.5px;padding:2px}
.sums{background:var(--surf);border-radius:14px;padding:12px 14px;margin:14px 0;display:grid;gap:6px}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sum.total{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.sums .note{margin:0}
.row-btns{display:flex;gap:8px}
.cart-empty{text-align:center;color:var(--mut);padding:30px 10px;display:grid;justify-items:center;gap:6px}
.cart-empty svg{width:44px;height:44px}
.done{text-align:center;display:grid;justify-items:center;gap:8px;padding-bottom:20px}
.done h3{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;font-size:34px;margin:6px 0 0}
.done p{margin:0;max-width:36ch}
.order-no{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-size:28px;background:var(--surf);border:1.5px dashed var(--line);padding:4px 18px;border-radius:12px;direction:ltr}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;transition:opacity .25s,transform .25s;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:26px;padding-block:24px 26px}.swatch{order:-1;max-width:min(520px,100%);margin:10px auto 0;width:100%}.hero .txt{text-align:center}.hero p.tag{margin-inline:auto}.hero .acts,.hero .facts{justify-content:center}}
@media (prefers-reduced-motion:reduce){.card .in,.swatch .fab,.card .ph img{transition:none}}
@media (max-width:560px){.row{flex-wrap:wrap}.row .acts{width:100%;justify-content:flex-start}}
</style>
<div id="root"></div>
<script id="app" type="text/plain">
(function(){

var S=JSON.parse(document.getElementById('data').textContent);
var COLORS={kids:'#86BEE3',jackets:'#DE6E8A',women:'#9B3B4E',blankets:'#C9A27E',scarves:'#8C8C94',baskets:'#C9364F',coasters:'#F0B442',mats:'#E8C37A',flowers:'#D2303C',hair:'#E9A6B8',mirrors:'#B9A2D6',bookmarks:'#7FA88A',keychains:'#F2A55C',kitchen:'#5BA36F',decor:'#E3C9A8'};

var FAMS=[['wear','ملابس',['jackets','kids','women','scarves','hair']],['home','للبيت',['blankets','mats','coasters','baskets','mirrors','kitchen','decor']],['gift','إكسسوارات وهدايا',['bookmarks','keychains','flowers']]];
function famOf(cid){for(var i=0;i<FAMS.length;i++)if(FAMS[i][2].indexOf(cid)>=0)return FAMS[i][0];return 'gift'}
function famName(f){for(var i=0;i<FAMS.length;i++)if(FAMS[i][0]===f)return FAMS[i][1];return ''}
function norm(t){return String(t||'').toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}

palette:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-1 2-2 0-1.5-1.3-1.8-1.3-3 0-1 .8-2 2.3-2H17a4 4 0 0 0 4-4c0-4-4-7-9-7Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="14.5" cy="7" r="1.2"/></svg>',
chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5 5.3 16A8 8 0 1 1 8 18.7Z"/><path d="M9 10.5h6M9 13.5h4"/></svg>',
grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8L12 16.9l-5.2 2.75 1-5.8-4.2-4.1 5.8-.85Z"/></svg>',
bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>'};
var $=function(s,el){return (el||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function catOf(id){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===id)return S.cats[i];return null}
function prods(cid){return S.products.filter(function(p){return p.cat===cid&&(isAdmin||!p.hidden)})}
function cats2(){return visibleCats().filter(function(c){return !view.fam||famOf(c.id)===view.fam})}
function visibleCats(){return S.cats.filter(function(c){return !c.hidden&&(isAdmin||prods(c.id).length)})}
function priceHTML(p,cls){return p.price?'<span class="'+cls+'">'+esc(p.price)+' '+esc(S.settings.currency||'')+'</span>':'<span class="'+cls+' ask">السعر عند الطلب</span>'}
var STATUS={order:'يُصنع حسب الطلب',ready:'جاهز للتسليم',out:'غير متوفر حالياً'};
function yarnIcon(col){return '<svg class="yarn" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="'+col+'"/><g fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1.6"><path d="M6 15c8 2 20 2 28-2"/><path d="M5 22c10 3 21 2 30-3"/><path d="M9 30c8 1 16-1 23-6"/><path d="M14 5c-3 9-2 21 3 31"/><path d="M24 4c4 9 4 22-2 32"/></g><path d="M34 26c5 3 4 8-2 9" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round"/></svg>'}
function waLink(text){var n=(S.settings.whatsapp||'').replace(/[^0-9]/g,'');if(!n)return '';return 'https://wa.me/'+n+'?text='+encodeURIComponent(text)}

/* ---------- shop: cart, favourites, sort ---------- */
var store={get:function(k,d){try{var v=localStorage.getItem('shita:'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem('shita:'+k,JSON.stringify(v))}catch(e){}}};
var cart=store.get('cart',[]),favs=store.get('fav',[]),info=store.get('info',{name:'',phone:'',city:'',address:'',note:''});
function pById(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null}
function shopP(id){var p=pById(id);return p&&(!p.hidden||isAdmin)?p:null}
cart=cart.filter(function(l){return shopP(l.id)});favs=favs.filter(function(id){return shopP(id)});
function num(p){var n=parseFloat(String(p.price||'').replace(/[^0-9.]/g,''));return isNaN(n)?null:n}
function money(n){return Math.round(n).toLocaleString('en-US')+' '+(S.settings.currency||'')}
function sortList(a){if(!view.sort)return a;var k=view.sort==='low'?1:-1;return a.slice().sort(function(x,y){var X=num(x),Y=num(y);if(X==null&&Y==null)return 0;if(X==null)return 1;if(Y==null)return -1;return (X-Y)*k})}
function isFav(id){return favs.indexOf(id)>=0}
function toast(t){var el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},2200)}
function cartCount(){return cart.reduce(function(s,l){return s+l.qty},0)}
function updateBadges(){var a=$('#cartN'),b=$('#favN');if(a){a.textContent=cartCount();a.dataset.n=cartCount()}if(b){b.textContent=favs.length;b.dataset.n=favs.length}}
function saveCart(){store.set('cart',cart);updateBadges()}
function toggleFav(id){var i=favs.indexOf(id);if(i>=0){favs.splice(i,1);toast('انشالت من المفضلة')}else{favs.push(id);toast('انضافت للمفضلة')}store.set('fav',favs);updateBadges();
  document.querySelectorAll('[data-fav="'+id+'"]').forEach(function(b){b.setAttribute('aria-pressed',isFav(id))})}
function addToCart(id,size,qty){var l=null;cart.forEach(function(x){if(x.id===id&&(x.size||'')===(size||''))l=x});if(l)l.qty=Math.min(20,l.qty+qty);else cart.push({id:id,size:size||'',qty:qty});saveCart();toast('انضافت للسلة')}
function totals(){var sum=0,ask=0;cart.forEach(function(l){var p=pById(l.id),n=p?num(p):null;if(n==null)ask++;else sum+=n*l.qty});return {sum:sum,ask:ask}}
function lineHTML(p,sub,right){return '<div class="line"><img src="'+(p.imgs[0]||'')+'" alt=""><div class="lt"><h4>'+esc(p.name)+'</h4><div class="sub">'+sub+'</div></div><div class="le">'+right+'</div></div>'}
function sheetHead(t){return '<div class="x"><b class="disp" style="font-size:30px;line-height:1">'+t+'</b><button class="btn ghost small" data-close>إغلاق</button></div>'}
function openCart(){
  var h=sheetHead('سلّتك')+'<div class="body">';
  if(!cart.length){h+='<div class="cart-empty">'+ICON.bag+'<p>سلّتك فاضية.<br>افتحي أي قطعة واضغطي «أضيفي للسلة».</p><button class="btn primary" data-close>رجوع للمنتجات</button></div></div>';showDlg(h);return}
  cart.forEach(function(l,i){var p=pById(l.id);var n=num(p);
    h+=lineHTML(p,(l.size?'المقاس '+esc(l.size)+' · ':'')+(n==null?'السعر عند الطلب':money(n))+'<div class="qty"><button data-cq="'+i+'" data-d="1" aria-label="زيادة">+</button><span>'+l.qty+'</span><button data-cq="'+i+'" data-d="-1" aria-label="إنقاص">−</button></div>',
      '<b class="lp">'+(n==null?'—':money(n*l.qty))+'</b><button class="rm" data-rm="'+i+'">إزالة</button>')});
  var t=totals();
  h+='<div class="sums"><div class="sum total"><span>المجموع</span><span>'+money(t.sum)+'</span></div>'+(t.ask?'<p class="note">+ '+t.ask+' قطعة سعرها عند الطلب، منتفق عليه على واتساب.</p>':'')+'<p class="note">أجرة التوصيل منتفق عليها على واتساب حسب منطقتك.</p></div>';
  h+='<button class="btn primary" id="toCo" style="width:100%">إتمام الطلب</button></div>';
  var d=showDlg(h);
  d.querySelectorAll('[data-cq]').forEach(function(b){b.onclick=function(){var l=cart[+b.dataset.cq];l.qty+= +b.dataset.d;if(l.qty<1)cart.splice(+b.dataset.cq,1);if(l.qty>20)l.qty=20;saveCart();openCart()}});
  d.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){cart.splice(+b.dataset.rm,1);saveCart();toast('انشالت من السلة');openCart()}});
  $('#toCo',d).onclick=openCheckout;
}
function openFav(){
  var h=sheetHead('المفضلة')+'<div class="body">';
  if(!favs.length)h+='<div class="cart-empty">'+ICON.star+'<p>لسّا ما حفظتي شي.<br>اضغطي على النجمة فوق أي قطعة لتحفظيها هون.</p><button class="btn primary" data-close>رجوع للمنتجات</button></div>';
  else favs.forEach(function(id){var p=pById(id);h+=lineHTML(p,priceHTML(p,'pr'),'<button class="btn ghost small" data-view="'+id+'">عرض</button><button class="rm" data-unfav="'+id+'">إزالة</button>')});
  var d=showDlg(h+'</div>');
  d.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){openProduct(b.dataset.view)}});
  d.querySelectorAll('[data-unfav]').forEach(function(b){b.onclick=function(){toggleFav(b.dataset.unfav);openFav()}});
}
function orderNo(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return 'SD-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+Math.floor(1000+Math.random()*9000)}
function openCheckout(){
  if(!cart.length){openCart();return}
  var f=function(id,lab,val,extra){return '<div class="fld"><label for="'+id+'">'+lab+'</label><input id="'+id+'" value="'+esc(val)+'" '+(extra||'')+'></div>'};
  var h=sheetHead('إتمام الطلب')+'<form class="body" id="coF" novalidate>'+
    f('coName','الاسم',info.name,'autocomplete="name" placeholder="مثلاً: سارة أحمد"')+
    '<div class="two">'+f('coPhone','رقم الموبايل',info.phone,'type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="09XX XXX XXX"')+f('coCity','المدينة أو المنطقة',info.city,'placeholder="مثلاً: دمشق - المزة"')+'</div>'+
    f('coAddr','العنوان',info.address,'autocomplete="street-address" placeholder="الحي، الشارع، البناية"')+
    '<div class="fld"><label for="coNote">ملاحظات (اختياري)</label><textarea id="coNote" placeholder="مثلاً: اللون اللي بدك ياه، المقاس، أو أي تفصيل">'+esc(info.note||'')+'</textarea></div>';
  var t=totals();
  h+='<div class="sums">';cart.forEach(function(l){var p=pById(l.id),n=num(p);h+='<div class="sum"><span>'+esc(p.name)+(l.size?' · '+esc(l.size):'')+' ×'+l.qty+'</span><span>'+(n==null?'عند الطلب':money(n*l.qty))+'</span></div>'});
  h+='<div class="sum total"><span>المجموع</span><span>'+money(t.sum)+'</span></div><p class="note">أجرة التوصيل والدفع منتفق عليهن على واتساب حسب منطقتك.</p></div>';
  h+='<p class="err" id="coErr"></p><div class="row-btns"><button type="button" class="btn ghost" id="coBack">رجوع للسلة</button><button class="btn primary" style="flex:1">أرسلي الطلب على واتساب</button></div></form>';
  var d=showDlg(h);
  $('#coBack',d).onclick=openCart;
  $('#coF',d).onsubmit=function(e){e.preventDefault();var g=function(id){return $('#'+id,d).value.trim()};
    info={name:g('coName'),phone:g('coPhone'),city:g('coCity'),address:g('coAddr'),note:g('coNote')};store.set('info',info);
    var er=$('#coErr',d);
    if(!info.name||!info.city||!info.address){er.textContent='عبّي الاسم والمدينة والعنوان لنقدر نوصّلك الطلب.';return}
    if(!/^[0-9+ ]{8,16}$/.test(info.phone)){er.textContent='رقم الموبايل لازم يكون أرقام بس، من 8 لـ 16 خانة.';return}
    var no=orderNo(),T=totals();
    var lines=['طلب جديد من '+S.settings.name,'رقم الطلب: '+no,'','الاسم: '+info.name,'الموبايل: '+info.phone,'المدينة: '+info.city,'العنوان: '+info.address,''];
    cart.forEach(function(l){var p=pById(l.id),n=num(p);lines.push('• '+p.name+(l.size?' | المقاس '+l.size:'')+' | العدد '+l.qty+' | '+(n==null?'السعر عند الطلب':money(n*l.qty)))});
    lines.push('','المجموع: '+money(T.sum)+(T.ask?' + قطع سعرها عند الطلب':''),'التوصيل والدفع: منتفق عليهن');
    if(info.note)lines.push('ملاحظات: '+info.note);
    var url=waLink(lines.join('\n'));
    if(!url){er.textContent='رقم الواتساب تبع المحل مش محطوط. تواصلي معنا على إنستغرام.';return}
    try{window.open(url,'_blank','noopener')}catch(x){}
    cart=[];saveCart();
    showDlg(sheetHead('خطوة أخيرة')+'<div class="body done"><h3>شكراً '+esc(info.name.split(' ')[0])+'</h3><p>انفتح واتساب ومعه تفاصيل طلبك. اضغطي <b>إرسال</b> هناك ليوصلنا الطلب.</p><div class="order-no">'+no+'</div><p class="note">هاد رقم طلبك. إذا ما انفتح واتساب، اضغطي الزر تحت.</p><a class="btn primary" href="'+url+'" target="_blank" rel="noopener">افتحي واتساب وأرسلي الطلب</a><button class="btn ghost" data-close>رجوع للمتجر</button></div>');
  };
}

/* ---------- render ---------- */
function render(){
  document.title=S.settings.name;
  var cats=visibleCats();
  var h='';
  h+='<header class="top pad"><div class="wrap"><a class="brand" href="#top" aria-label="'+esc(S.settings.name)+'"><span class="mk">'+yarnIcon('#F4EEE6')+'</span><b>'+esc(S.settings.name)+'</b></a><span class="sp"></span>';
  var wl=waLink('مرحبا، حابة أسأل عن منتجاتكم');
  h+='<div class="tools"><button class="icon-btn" id="favBtn" aria-label="المفضلة">'+ICON.star+'<span class="n" id="favN" data-n="'+favs.length+'">'+favs.length+'</span></button><button class="icon-btn" id="cartBtn" aria-label="السلة">'+ICON.bag+'<span class="n" id="cartN" data-n="'+cartCount()+'">'+cartCount()+'</span></button>';
  if(wl)h+='<a class="btn primary small wa" href="'+wl+'" target="_blank" rel="noopener" aria-label="راسلينا على واتساب">'+ICON.chat+'<span class="t">راسلينا على واتساب</span></a>';
  else if(S.settings.instagram)h+='<a class="btn ghost small" href="https://instagram.com/'+esc(S.settings.instagram.replace('@',''))+'" target="_blank" rel="noopener">إنستغرام</a>';
  h+='</div></div></header>';
  var nAll=S.products.filter(function(p){return !p.hidden}).length;
  h+='<section class="hero pad" id="top"><div class="wrap"><div class="txt"><h1>'+esc(S.settings.headline)+'</h1><p class="tag">'+esc(S.settings.tagline)+'</p><div class="acts"><a class="btn primary" href="#shop">تسوّقي المنتجات</a><a class="btn ghost" href="#how">طريقة الطلب</a></div>'+

var WAYS=[['#F1E8DA','#9E2F4C','#E1D3BE'],['#2F5546','#F1EADD','#264638'],['#E2A93B','#22304F','#CC9530'],['#9CC6E4','#FBFBF8','#86B2D2'],['#E58FA5','#6E1F36','#D47C93']];

function shade(hex,amt){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;function f(c){return Math.max(0,Math.min(255,Math.round(amt<0?c*(1+amt):c+(255-c)*amt)))}return 'rgb('+f(r)+','+f(g)+','+f(b)+')'}
function stitchSprite(col,w,h,dpr){
  var c=document.createElement('canvas');c.width=Math.ceil(w*dpr);c.height=Math.ceil(h*1.5*dpr);var g=c.getContext('2d');g.scale(dpr,dpr);
  [-1,1].forEach(function(s){g.save();g.translate(w/2+s*w*.2,h*.72);g.rotate(s*.34);
    var gr=g.createLinearGradient(0,-h*.6,0,h*.6);gr.addColorStop(0,shade(col,.28));gr.addColorStop(.45,col);gr.addColorStop(1,shade(col,-.32));
    g.beginPath();g.ellipse(0,0,w*.205,h*.62,0,0,Math.PI*2);g.fillStyle=gr;g.fill();
    g.lineWidth=Math.max(.6,w*.05);g.strokeStyle=shade(col,-.45);g.globalAlpha=.55;g.stroke();g.globalAlpha=1;
    g.beginPath();g.ellipse(-w*.05,-h*.18,w*.07,h*.22,0,0,Math.PI*2);g.fillStyle='rgba(255,255,255,.18)';g.fill();
    g.restore()});
  return c;
}
function purlSprite(col,w,h,dpr){
  var c=document.createElement('canvas');c.width=Math.ceil(w*dpr);c.height=Math.ceil(h*1.5*dpr);var g=c.getContext('2d');g.scale(dpr,dpr);

  g.beginPath();g.ellipse(w/2,h*.75,w*.46,h*.3,0,0,Math.PI*2);g.fillStyle=gr;g.fill();return c;
}
function knitGrid(){
  var STAR=['...X...','.X.X.X.','..XXX..','XXX.XXX','..XXX..','.X.X.X.','...X...'];
  var name=S.settings.name||'',TR=16;
  var tc=document.createElement('canvas'),tg=tc.getContext('2d'),fs=TR*4;
  var font='400 '+fs+'px "Lalezar","IBM Plex Sans Arabic",sans-serif';
  tg.font=font;var tw=Math.ceil(tg.measureText(name).width)+8;
  tc.width=tw;tc.height=Math.ceil(fs*1.7);tg.font=font;tg.direction='rtl';tg.textAlign='center';tg.textBaseline='middle';tg.fillStyle='#000';tg.fillText(name,tw/2,tc.height*.56);
  var px=tg.getImageData(0,0,tc.width,tc.height).data;
  var minY=tc.height,maxY=0,minX=tw,maxX=0;
  for(var y=0;y<tc.height;y++)for(var x=0;x<tw;x++)if(px[(y*tw+x)*4+3]>100){if(y<minY)minY=y;if(y>maxY)maxY=y;if(x<minX)minX=x;if(x>maxX)maxX=x}
  if(maxY<minY){minY=0;maxY=tc.height-1;minX=0;maxX=tw-1}
  var cellH=(maxY-minY+1)/TR,cellW=cellH*1.12,TC=Math.ceil((maxX-minX+1)/cellW);
  var cols=Math.max(46,TC+10);cols=Math.ceil((cols-1)/10)*10+1;
  var rows=[];var motif=function(r){return r.map(function(v){return v?1:0})};
  var blank=function(){return new Array(cols).fill(0)};
  function band(){var out=[],dot=new Array(cols).fill(1);out.push(dot,blank());
    var per=10,off=2;
    STAR.forEach(function(line){var r=blank();for(var i=0;i<cols;i++){var k=(i-off)%per;if(k>=0&&k<7&&line[k]==='X')r[i]=1;if(k===8||k===9){}}out.push(r)});
    out.push(blank(),dot.slice());return out}
  rows=rows.concat([blank()],band(),[blank(),blank()]);
  var x0=Math.floor((cols-TC)/2);
  for(var r=0;r<TR;r++){var row=blank();for(var cI=0;cI<TC;cI++){var sx=minX+Math.floor((cI+.5)*cellW),sy=minY+Math.floor((r+.5)*cellH),hit=0,n=0;
      for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var X=sx+Math.round(dx*cellW/3),Y=sy+Math.round(dy*cellH/3);if(X>=0&&X<tw&&Y>=0&&Y<tc.height){n++;if(px[(Y*tw+X)*4+3]>110)hit++}}
      if(hit/n>.42)row[x0+cI]=1}
    rows.push(row)}
  rows=rows.concat([blank(),blank()],band(),[blank()]);
  return {cols:cols,rows:rows,rib:6};
}
function initKnit(){
  var cv=$('#knit');if(!cv)return;

    var go=function(){knit.grid=knitGrid();knit.gname=S.settings.name;if($('#knit'))initKnit()};
    knit.grid=null;knit.gname=S.settings.name;
    try{Promise.race([document.fonts.load('400 64px "Lalezar"'),new Promise(function(r){setTimeout(r,1500)})]).then(go,go)}catch(e){go()}

  }

  else{var t0=0;var step=function(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1700);draw(Math.ceil(total*(1-Math.pow(1-p,2))));if(p<1)raf=requestAnimationFrame(step);else knit.done=true};raf=requestAnimationFrame(step)}

  if(!reduce){host.onpointermove=function(e){if(e.pointerType!=='mouse')return;var r=host.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;fab.style.transform='rotateX('+(8-y*12)+'deg) rotateY('+(-10+x*18)+'deg) rotateZ(-1.5deg)'};
    host.onpointerleave=function(){fab.style.transform=''}}
}

    else ob.innerHTML=isAdmin?'<div class="empty">أضيفي رقم الواتساب من لوحة التحكم ← الإعدادات، ليظهر زر الطلب.</div>':(S.settings.instagram?'<p>للطلب راسلينا على إنستغرام: <span class="sel">'+esc(S.settings.instagram)+'</span></p>':'');
  }

  d.querySelectorAll('.sizes button').forEach(function(b){b.onclick=function(){size=b.dataset.s;d.querySelector('#pErr').textContent='';d.querySelectorAll('.sizes button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});orderBox()}});
  var g=d.querySelector('#gal'),dots=d.querySelectorAll('#dots b');
  if(g&&dots.length)g.addEventListener('scroll',function(){var i=Math.round(Math.abs(g.scrollLeft)/g.clientWidth);dots.forEach(function(b,j){b.className=j===i?'on':''})},{passive:true});
}

    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn primary small" data-new>+ منتج جديد</button><span class="meter">'+S.products.length+' منتج</span></div>';
    S.cats.forEach(function(c){var ps=S.products.filter(function(p){return p.cat===c.id});if(!ps.length)return;
      h+='<h3 style="margin:16px 0 8px">'+esc(c.name)+'</h3>';
      ps.forEach(function(p){var i=S.products.indexOf(p);
        h+='<div class="row"><img src="'+(p.imgs[0]||'')+'" alt=""><div class="t"><b>'+esc(p.name)+'</b><small>'+(p.price?esc(p.price)+' '+esc(S.settings.currency):'بدون سعر')+' · '+(p.hidden?'مخفي':esc(STATUS[p.status]||''))+'</small></div><div class="acts"><button class="btn ghost small" data-up="'+i+'" aria-label="لفوق">↑</button><button class="btn ghost small" data-ed="'+p.id+'">تعديل</button><button class="btn ghost small" data-hide="'+p.id+'">'+(p.hidden?'إظهار':'إخفاء')+'</button><button class="btn ghost small" data-del="'+p.id+'">حذف</button></div></div>';
        if(pendingDel===p.id)h+='<div class="confirm">متأكدة بدك تحذفي «'+esc(p.name)+'»؟<button class="btn primary small" data-delok="'+p.id+'">نعم، احذفي</button><button class="btn ghost small" data-delno>تراجع</button></div>';
      });
    });
  }else if(tab==='edit'){
    if(!editing)editing={_new:true,id:uid(),cat:(view.cat||S.cats[0].id),name:'',desc:'',price:'',sizes:'',colors:'',status:'order',imgs:[]};
    var e=editing;
    h+='<div class="fld"><label>صور المنتج (أول صورة هي الغلاف)</label><div class="thumbs" id="thumbs">'+e.imgs.map(function(s,i){return '<div class="th"><img src="'+s+'" alt=""><button data-rm="'+i+'" aria-label="حذف الصورة">×</button>'+(i?'<button class="mv" data-cover="'+i+'" aria-label="اجعليها الغلاف">★</button>':'')+'</div>'}).join('')+'<label class="upl" aria-label="إضافة صور">+<input type="file" accept="image/*" multiple hidden id="fileIn"></label></div><span class="meter" id="upMsg"></span></div>';
    h+='<div class="fld"><label for="fName">اسم المنتج</label><input id="fName" value="'+esc(e.name)+'" placeholder="مثلاً: كارديجان الفيونكات"></div>';
    h+='<div class="two"><div class="fld"><label for="fCat">القسم</label><select id="fCat">'+S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===e.cat?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div>';
    h+='<div class="fld"><label for="fPrice">السعر ('+esc(S.settings.currency)+') — اتركيه فاضي إذا السعر عند الطلب</label><input id="fPrice" inputmode="decimal" value="'+esc(e.price)+'"></div></div>';
    h+='<div class="two"><div class="fld"><label for="fSizes">المقاسات (افصلي بفاصلة)</label><input id="fSizes" value="'+esc(e.sizes)+'" placeholder="2 سنة، 4 سنوات، 6 سنوات"></div><div class="fld"><label for="fColors">الألوان المتوفرة</label><input id="fColors" value="'+esc(e.colors)+'" placeholder="كريمي، وردي، أزرق"></div></div>';
    h+='<div class="fld"><label for="fStatus">الحالة</label><select id="fStatus">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(k===e.status?' selected':'')+'>'+STATUS[k]+'</option>'}).join('')+'</select></div>';
    h+='<div class="fld"><label for="fDesc">الوصف</label><textarea id="fDesc">'+esc(e.desc)+'</textarea></div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-saveprod>'+(e._new?'أضيفي المنتج':'احفظي التعديل')+'</button><button class="btn ghost" data-cancel>إلغاء</button></div><p class="meter" id="edMsg"></p>';
  }else if(tab==='cats'){
    h+='<p class="meter">الأقسام الفاضية ما بتظهر للزبائن لحد ما تضيفي فيها منتج.</p>';
    S.cats.forEach(function(c,i){var n=S.products.filter(function(p){return p.cat===c.id}).length;
      h+='<div class="row" style="padding:8px 12px">'+yarnIcon(COLORS[c.id]||'#DE6E8A')+'<div class="t"><input data-cname="'+i+'" value="'+esc(c.name)+'" aria-label="اسم القسم" style="font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dashed var(--line);width:100%;padding:4px 0"><small>'+n+' منتج</small></div><div class="acts"><button class="btn ghost small" data-cup="'+i+'" aria-label="لفوق">↑</button><button class="btn ghost small" data-chide="'+i+'">'+(c.hidden?'إظهار':'إخفاء')+'</button></div></div>'});
    h+='<div class="two" style="margin-top:10px"><div class="fld"><label for="newCat">قسم جديد</label><input id="newCat" placeholder="مثلاً: ألعاب كروشيه"></div><div class="fld" style="align-self:end"><button class="btn ghost" data-addcat>أضيفي القسم</button></div></div>';
  }else{
    var st=S.settings;
    h+='<div class="fld"><label for="sName">اسم المتجر</label><input id="sName" value="'+esc(st.name)+'"></div>';
    h+='<div class="fld"><label for="sHead">العنوان الكبير</label><input id="sHead" value="'+esc(st.headline)+'"></div>';
    h+='<div class="fld"><label for="sTag">الجملة تحت العنوان</label><textarea id="sTag">'+esc(st.tagline)+'</textarea></div>';
    h+='<div class="two"><div class="fld"><label for="sWa">رقم الواتساب مع رمز الدولة</label><input id="sWa" inputmode="tel" dir="ltr" value="'+esc(st.whatsapp)+'" placeholder="+963 9xx xxx xxx"></div><div class="fld"><label for="sIg">حساب إنستغرام</label><input id="sIg" dir="ltr" value="'+esc(st.instagram)+'" placeholder="@yourshop"></div></div>';
    h+='<div class="fld"><label for="sCur">العملة</label><input id="sCur" value="'+esc(st.currency)+'"></div><button class="btn ghost" data-saveset>طبّقي الإعدادات</button>';
  }
  h+='</div><div class="savebar"><span class="msg" id="saveMsg">'+(saveMsg||(dirty?'في تعديلات ما انحفظت. اضغطي «انشري التعديلات» ليشوفها الزبائن.':'كل شي محفوظ ومنشور.'))+'</span><button class="btn primary" data-publish'+(dirty?'':' disabled')+'>انشري التعديلات</button></div>';
  var d=showDlg(h);bindAdmin(d);
}
function mark(){dirty=true;saveMsg='';view.keep=true;render()}
function bindAdmin(d){
  var on=function(sel,fn){d.querySelectorAll(sel).forEach(function(b){b.onclick=function(){fn(b)}})};
  on('[data-tab]',function(b){tab=b.dataset.tab;if(tab!=='edit')editing=null;renderAdmin()});
  on('[data-new]',function(){editing=null;tab='edit';renderAdmin()});
  on('[data-ed]',function(b){var p=S.products.find(function(q){return q.id===b.dataset.ed});editing=JSON.parse(JSON.stringify(p));tab='edit';renderAdmin()});
  on('[data-hide]',function(b){var p=S.products.find(function(q){return q.id===b.dataset.hide});p.hidden=!p.hidden;mark();renderAdmin()});
  on('[data-up]',function(b){var i=+b.dataset.up,p=S.products[i];var prev=-1;for(var j=i-1;j>=0;j--)if(S.products[j].cat===p.cat){prev=j;break}if(prev<0)return;S.products[i]=S.products[prev];S.products[prev]=p;mark();renderAdmin()});
  on('[data-del]',function(b){pendingDel=b.dataset.del;renderAdmin()});
  on('[data-delno]',function(){pendingDel=null;renderAdmin()});
  on('[data-delok]',function(b){S.products=S.products.filter(function(p){return p.id!==b.dataset.delok});pendingDel=null;mark();renderAdmin()});
  on('[data-cancel]',function(){editing=null;tab='products';renderAdmin()});
  var grab=function(){if(!editing)return;var g=function(id){var el=d.querySelector(id);return el?el.value.trim():''};editing.name=g('#fName');editing.cat=g('#fCat')||editing.cat;editing.price=g('#fPrice');editing.sizes=g('#fSizes');editing.colors=g('#fColors');editing.status=g('#fStatus')||'order';editing.desc=g('#fDesc')};
  on('[data-rm]',function(b){grab();editing.imgs.splice(+b.dataset.rm,1);renderAdmin()});
  on('[data-cover]',function(b){grab();var i=+b.dataset.cover;var s=editing.imgs.splice(i,1)[0];editing.imgs.unshift(s);renderAdmin()});
  var fi=d.querySelector('#fileIn');
  if(fi)fi.onchange=function(){grab();var files=[].slice.call(fi.files);var m=d.querySelector('#upMsg');m.textContent='جاري تجهيز '+files.length+' صورة…';
    Promise.all(files.map(compress)).then(function(arr){arr.forEach(function(s){if(s)editing.imgs.push(s)});renderAdmin()}).catch(function(){m.textContent='ما قدرت أقرأ وحدة من الصور. جربي صورة JPG أو PNG.'})};
  on('[data-saveprod]',function(){grab();var m=d.querySelector('#edMsg');
    if(!editing.name){m.textContent='اكتبي اسم المنتج أول.';return}
    if(!editing.imgs.length){m.textContent='أضيفي صورة وحدة على الأقل.';return}
    var isNew=editing._new;delete editing._new;
    if(isNew)S.products.push(editing);else{var i=S.products.findIndex(function(p){return p.id===editing.id});S.products[i]=editing}
    editing=null;tab='products';mark();saveMsg=(isNew?'انضاف المنتج.':'انحفظ التعديل.')+' اضغطي «انشري التعديلات» ليشوفه الزبائن.';renderAdmin()});
  d.querySelectorAll('[data-cname]').forEach(function(inp){inp.onchange=function(){var v=inp.value.trim();if(v){S.cats[+inp.dataset.cname].name=v;mark();renderAdmin()}}});
  on('[data-chide]',function(b){var c=S.cats[+b.dataset.chide];c.hidden=!c.hidden;mark();renderAdmin()});
  on('[data-cup]',function(b){var i=+b.dataset.cup;if(!i)return;var c=S.cats[i];S.cats[i]=S.cats[i-1];S.cats[i-1]=c;mark();renderAdmin()});
  on('[data-addcat]',function(){var v=d.querySelector('#newCat').value.trim();if(!v)return;S.cats.push({id:'c'+Date.now().toString(36),name:v});mark();renderAdmin()});
  on('[data-saveset]',function(){var g=function(id){return d.querySelector(id).value.trim()};var st=S.settings;st.name=g('#sName')||st.name;st.headline=g('#sHead')||st.headline;st.tagline=g('#sTag');st.whatsapp=g('#sWa');st.instagram=g('#sIg');st.currency=g('#sCur');mark();saveMsg='تطبّقت الإعدادات. اضغطي «انشري التعديلات» ليشوفها الزبائن.';renderAdmin()});
  on('[data-publish]',publishNow);
}
function compress(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var L=1000,s=Math.min(1,L/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var out=c.toDataURL('image/webp',.72);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',.78);res(out)};im.src=r.result};r.readAsDataURL(file)})}
var RESET_FALLBACK=':root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){
  var reset=RESET_FALLBACK;var hs=document.head.querySelector('style');if(hs&&hs.textContent.length<2000)reset=hs.textContent;
  var C='<'+'/script>',fonts=document.querySelector('link[href*="fonts.googleapis.com/css2"]');
  var data=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
   '<title>'+esc(S.settings.name)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com"><link href="'+(fonts?fonts.getAttribute('href'):'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap')+'" rel="stylesheet">\n'+
   '<style id="css">'+document.getElementById('css').textContent+'</style>\n<div id="root"></div>\n<script id="data" type="application/json">'+data+C+'\n'+
   '<script id="app">'+document.getElementById('app').textContent+C+'</body></html>';
}
function publishNow(){
  if(window.__ghPublish){window.__ghPublish(S,function(ok,m){if(ok)dirty=false;saveMsg=m;view.keep=true;render();renderAdmin()});return}
  var msg=document.getElementById('saveMsg'),btn=document.querySelector('[data-publish]');
  if(btn)btn.disabled=true;if(msg)msg.textContent='جاري النشر…';
  if(!window.claude||!window.claude.use){if(msg)msg.textContent='النشر يشتغل بس لما تفتحي الموقع من حسابك على Claude.';if(btn)btn.disabled=false;return}
  var doc=buildDoc();
  if(doc.length>15*1048576){if(msg)msg.textContent='الموقع صار كبير كتير. احذفي بعض الصور القديمة وجربي مرة تانية.';if(btn)btn.disabled=false;return}
  window.claude.use('artifact').then(function(a){
    if(!a)throw {code:'not_granted'};
    return a.publish(doc);
  }).then(function(){dirty=false;saveMsg='نُشرت التعديلات.'}).catch(function(e){
    var c=e&&e.code;var t={conflict:'في نسخة أحدث نُشرت من مكان تاني. الصفحة رح تتحدث، وبعدها عيدي التعديل.',not_writer:'هالنسخة للعرض بس. افتحي الموقع من حسابك لتقدري تنشري.',not_granted:'النشر مش متاح من هون. افتحي الموقع من حسابك على Claude.',too_large:'الموقع صار كبير كتير. احذفي بعض الصور وجربي مرة تانية.',rate_limited:'نشرتي كتير بوقت قصير. استني دقيقة وجربي.'}[c]||'صار خطأ بالنشر. جربي بعد شوي.';
    if(msg)msg.textContent=t;if(btn)btn.disabled=false;
  });
}

/* ---------- start ---------- */
window.__siteDoc=buildDoc;
render();
if(location.hash==='#admin'||window.__ADMIN){isAdmin=true;render();if(window.__ADMIN)openAdmin()}
try{window.claude&&window.claude.use&&window.claude.use('user').then(function(u){if(u&&u.isOwner&&u.isOwner()){isAdmin=true;view.keep=true;render()}}).catch(function(){})}catch(e){}
window.addEventListener('hashchange',function(){if(location.hash==='#admin'&&!isAdmin){isAdmin=true;render();openAdmin()}});
})();
</script>
<script>
(function(){function boot(d){var s=document.createElement('script');s.id='data';s.type='application/json';s.textContent=JSON.stringify(d);document.body.appendChild(s);var a=document.createElement('script');a.textContent=document.getElementById('app').textContent;document.body.appendChild(a)}
function fail(t){document.getElementById('root').innerHTML='<p style="padding:60px 20px;text-align:center;font-size:17px">'+t+'</p>'}
fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(boot).catch(function(){fail('ما قدرنا نحمّل المنتجات. تأكدي من الإنترنت وحدّثي الصفحة.')});
})();
